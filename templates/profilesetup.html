<!DOCTYPE html>
<html>
  <head>
    <title>My Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    background-color: #007bff;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
  }

  button:hover {
    background-color: #0056b3;
  }
  @media screen and (max-width: 768px) {
    button {
      font-size: 16px;
    }
  }

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
}

.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
}

.profile img {
  width: 300px;
  height: 300px;
  border-radius: 50%;
  margin-bottom: 20px;
}

.profile h1 {
  font-size: 24px;
  margin-bottom: 10px;
}

.profile p {
  font-size: 16px;
  margin-bottom: 10px;
}

.profile a {
  font-size: 16px;
}

@media screen and (max-width: 768px) {
  .profile img {
    width: 100px;
    height: 100px;
  }

  .profile h1 {
    font-size: 20px;
  }

  .profile p {
    font-size: 14px;
  }

  .profile a {
    font-size: 14px;
  }
}

    </style>
  </head>
  <body>
    <div class="container">
      <div class="profile">
        <img src="{{data["image"]}}" alt="Profile Picture">
        <h1>{{data["name"]}}</h1>
        <p>Email: {{data["email"]}}</p>
        <p>Phone: {{data["phone"]}}</p>
        <button style="width: 60%;"><a style="text-decoration: none; color: white;" href="{{data["linkedin"]}}">LinkedIn Profile</a></button>
        <button id="scanButton">Scan</button>
        <button id="writeButton">Write</button>
        <button id="makeReadOnlyButton">Make Read-Only</button>
        <p id="log"></p>
      </div>
    </div>
    <script>
      let log;
        scanButton.addEventListener("click", async () => {
    document.getElementById("log").innerHTML += "User clicked scan button";
  
    try {
      const ndef = new NDEFReader();
      await ndef.scan();
      document.getElementById("log").innerHTML += "> Scan started";
  
      ndef.addEventListener("readingerror", () => {
        document.getElementById("log").innerHTML += "Argh! Cannot read data from the NFC tag. Try another one?";
      });
  
      ndef.addEventListener("reading", ({ message, serialNumber }) => {
        document.getElementById("log").innerHTML += `> Serial Number: ${serialNumber}`;
        document.getElementById("log").innerHTML += `> Records: (${message.records.length})`;
      });
    } catch (error) {
      document.getElementById("log").innerHTML += "Argh! " + error;
    }
  });
  
  writeButton.addEventListener("click", async () => {
    document.getElementById("log").innerHTML += "User clicked write button";
  
    try {
      const ndef = new NDEFReader();
            let message = 
      await ndef.write(message);
      document.getElementById("log").innerHTML += "> Message written";
    } catch (error) {
      document.getElementById("log").innerHTML += "Argh! " + error;
    }
  });
  
  makeReadOnlyButton.addEventListener("click", async () => {
    document.getElementById("log").innerHTML += "User clicked make read-only button";
  
    try {
      const ndef = new NDEFReader();
      await ndef.makeReadOnly();
      document.getElementById("log").innerHTML += "> NFC tag has been made permanently read-only";
    } catch (error) {
      document.getElementById("log").innerHTML += "Argh! " + error;
    }
  });
    </script>
  </body>
</html>
